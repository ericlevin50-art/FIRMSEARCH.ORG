<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thank You | FirmSearch.org</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f4f6fa;
      font-family: Arial, sans-serif;
      color: #333;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
    }

    .simple-logo {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #123b6d;
    }

    .card {
      background: white;
      padding: 30px 24px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1 {
      color: #222;
      font-size: 28px;
      margin-bottom: 15px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
    }

    .thanks {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 22px;
      background: #1769aa;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    .button:hover {
      background: #12558a;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="simple-logo">
      🔎 FirmSearch.org
    </div>

    <div class="card">

      <h1>Thank You!</h1>

      <p class="thanks">
        Your support means a lot.
      </p>

      <p>
        Thank you for supporting FirmSearch.org.
      </p>

      <p>
        Your contribution helps us continue providing
        human-powered research.
      </p>

      <a href="index.html" class="button">
        Back to FirmSearch.org
      </a>

    </div>

    <div class="footer">
      © 2026 FirmSearch.org — Human-Powered Research
    </div>

  </div>

</body>
</html>
